services:
  # Backend Node.js Server (host network for Bluetooth access)
  backend:
    build: ./backend
    container_name: aquamind-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # Only vars not in .env or specific overrides
    environment:
      - NODE_ENV=production
    volumes:
      - aquamind-data:/app/data
      # Mount /dev for USB/serial device access
      - /dev:/dev
      # Mount D-Bus for Bluetooth BLE access
      - /var/run/dbus:/var/run/dbus:ro
    devices:
      # Physical USB camera
      - /dev/video0:/dev/video0
    # Privileged mode for USB and BLE device access
    privileged: true
    # Host network required for Bluetooth access
    network_mode: host

  # Frontend React App (Nginx)
  frontend:
    build: ./frontend
    container_name: aquamind-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aquamind-network

volumes:
  aquamind-data:
    driver: local

networks:
  aquamind-network:
    driver: bridge
